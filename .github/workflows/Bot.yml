name: Trading Bot
on:
  schedule:
    - cron: '*/5 * * * *' # Har 5 minute mein bot chalega
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install ccxt
      - run: python main.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
